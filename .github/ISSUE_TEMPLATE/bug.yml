name: 🐞 Bug
description: Quelque chose ne marche pas comme prévu
labels: [bug, testeurs]
body:
  - type: dropdown
    id: role
    attributes:
      label: Espace utilisé
      options: [Client, Vendeur, Livreur, Admin, Inscription / connexion]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Je choisis « Client »
        2. J'ajoute « Riz local 25 kg » au panier
        3. Je clique sur « Commander »
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devait se passer / ce qui s'est passé
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Appareil et navigateur
      placeholder: "ex : iPhone 14, Safari — ou PC Windows, Chrome 131"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Capture d'écran / console (F12)
      description: Glissez une image ici. Ne collez JAMAIS de mot de passe.
